name: Build and publish Docker image

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.nirah.nl
        uses: docker/login-action@v3
        with:
          registry: registry.nirah.nl
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      # Cluster nodes are arm64 (see infra/kubernetes nodeSelector).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            registry.nirah.nl/medusa/kratos-selfservice:latest
            registry.nirah.nl/medusa/kratos-selfservice:${{ github.sha }}
